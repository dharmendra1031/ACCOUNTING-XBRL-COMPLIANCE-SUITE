name: Bootstrap frontend lockfile (one-time)

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate reviewed npm dependency resolution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies from pinned package.json
        working-directory: src/Keifac.Web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible dependency installation
        working-directory: src/Keifac.Web
        run: npm ci --no-audit --no-fund
      - name: Commit generated lockfile to development
        run: |
          git add src/Keifac.Web/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(web): lock resolved npm dependencies"
          git push origin HEAD:development
