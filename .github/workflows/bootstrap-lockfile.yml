name: Generate frontend dependency lockfile

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify and commit npm dependency lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned dependencies
        working-directory: src/Keifac.Web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        working-directory: src/Keifac.Web
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests and production build
        working-directory: src/Keifac.Web
        run: |
          npm test
          npm run build
      - name: Commit verified lockfile to development
        run: |
          git add src/Keifac.Web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(web): commit verified npm dependency lockfile"
          git push origin HEAD:development
