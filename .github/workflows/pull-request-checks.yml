name: Validate backend and frontend changes

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  api-build:
    name: ASP.NET Core API build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up supported .NET LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API (release)
        run: dotnet build src/Keifac.Api/Keifac.Api.csproj --configuration Release

      - name: Verify anonymous API boundary (no financial endpoints exposed)
        run: python3 tests/api/verify_api_boundary.py

      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  web-build:
    name: Frontend preview typecheck and build
    # Playwright 1.56 needs a supported Linux host; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Keifac.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test bilingual preview labels
        run: npm test
      - name: Typecheck and build preview
        run: npm run build
      - name: Set up Python for real Chromium browser QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runner and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser QA at desktop, mobile, Arabic RTL and zoom-equivalent widths
        run: python tests/browser/verify_preview.py
      - name: Upload browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keifac-frontend-browser-qa
          path: src/Keifac.Web/tests/browser/artifacts/
          retention-days: 14
          if-no-files-found: warn

  design-contracts:
    name: Pre-code documentation and OpenAPI structural check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Verify design contract consistency (not business tests)
        run: python tests/contracts/verify_precode.py
